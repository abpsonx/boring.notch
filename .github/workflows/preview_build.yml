name: Preview Build (unsigned)

# Builds an unsigned (ad-hoc signed) Boring Notch.app for local testing
# and uploads it as a downloadable artifact. No certificates or secrets needed.

on:
  push:
    branches:
      - notch-widgets
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned app
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select newest Xcode
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj -scheme boringNotch

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log | grep -E "error:|warning: .*Widgets|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build.log

      - name: Re-sign embedded frameworks ad-hoc
        # Prebuilt frameworks (e.g. MediaRemoteAdapter) carry the upstream Team ID.
        # dyld refuses to load them into an ad-hoc signed app ("different Team IDs"),
        # so sign everything inside the bundle ad-hoc too.
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)"
          echo "Found $APP"
          if [[ -d "$APP/Contents/Frameworks" ]]; then
            find "$APP/Contents/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 |
              while IFS= read -r -d '' item; do
                echo "Signing $item"
                codesign --force --deep --sign - "$item"
              done
          fi
          for dir in XPCServices Library/LoginItems Helpers; do
            if [[ -d "$APP/Contents/$dir" ]]; then
              find "$APP/Contents/$dir" -maxdepth 1 \( -name '*.xpc' -o -name '*.app' \) -print0 |
                while IFS= read -r -d '' item; do
                  echo "Signing $item"
                  codesign --force --sign - --preserve-metadata=entitlements,flags "$item"
                done
            fi
          done
          codesign --force --sign - --preserve-metadata=entitlements,flags "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP/Contents/Frameworks/MediaRemoteAdapter.framework" 2>&1 | grep -E "Signature|TeamIdentifier" || true
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Zip app
        run: ditto -c -k --keepParent "$APP_PATH" BoringNotch-preview.zip

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BoringNotch-preview
          path: BoringNotch-preview.zip
